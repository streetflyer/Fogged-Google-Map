<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="none" stroke="url(#gold)" stroke-width="8" opacity="0.6"/>

  <!-- Compass rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1e293b" stroke-width="6"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="10 12"/>
  <circle cx="256" cy="256" r="70" fill="#0f172a" stroke="url(#cyan)" stroke-width="4"/>

  <!-- North Needle -->
  <polygon points="256,76 288,256 256,220" fill="url(#gold)"/>
  <polygon points="256,76 224,256 256,220" fill="#fef3c7"/>

  <!-- South Needle -->
  <polygon points="256,436 288,256 256,292" fill="#475569"/>
  <polygon points="256,436 224,256 256,292" fill="#64748b"/>

  <!-- East Needle -->
  <polygon points="436,256 256,288 292,256" fill="#334155"/>
  <polygon points="436,256 256,224 292,256" fill="#475569"/>

  <!-- West Needle -->
  <polygon points="76,256 256,288 220,256" fill="#334155"/>
  <polygon points="76,256 256,224 220,256" fill="#475569"/>

  <!-- Center Pivot -->
  <circle cx="256" cy="256" r="16" fill="url(#gold)"/>
  <circle cx="256" cy="256" r="7" fill="#090d16"/>

  <!-- Cardinal points -->
  <text x="256" y="60" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-weight="900" font-size="28">N</text>
  <text x="256" y="482" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-weight="900" font-size="24">S</text>
  <text x="478" y="264" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-weight="900" font-size="24">E</text>
  <text x="34" y="264" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-weight="900" font-size="24">W</text>
</svg>
